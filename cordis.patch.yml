# dsh-deepseek-balance bundle: DeepSeek usage card for the Web profile.
#
# One dual-face row: the host half (lib/index.js) registers the
# /api/deepseek-status and /api/deepseek-token routes on the webserver; the
# client half (the package's dsh.client metadata) serves lib/client.js, which
# registers the usage strip ABOVE the Settings button plus the detail card.
- insert:
    - id: dsh-deepseek-balance
      name: 'dsh-deepseek-balance'
