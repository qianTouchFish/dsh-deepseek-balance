<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="470" rx="16" fill="#f7f8fa"/>

  <!-- sidebar -->
  <rect x="24" y="20" width="230" height="430" rx="12" fill="#ffffff" stroke="#d9dee5"/>
  <text x="44" y="52" font-size="13" fill="#57606a">侧边栏 Sidebar</text>
  <rect x="44" y="70" width="150" height="28" rx="6" fill="#eef1f4"/>
  <text x="52" y="89" font-size="12" fill="#57606a">会话列表…</text>
  <line x1="44" y1="120" x2="234" y2="120" stroke="#eef1f4"/>

  <!-- usage strip (above settings) -->
  <rect x="36" y="330" width="206" height="36" rx="8" fill="#18191d" stroke="#3a3d44"/>
  <text x="44" y="353" font-size="9" font-weight="700" fill="#3b82f6">余额 0.74</text>
  <text x="100" y="353" font-size="9" fill="#9ca3af">消费 11.99</text>
  <text x="156" y="353" font-size="9" fill="#9ca3af">请求 1.1k</text>
  <text x="196" y="353" font-size="9" fill="#9ca3af">Tkn 302M</text>
  <text x="42" y="324" font-size="10" fill="#57606a">↑ 本插件(常显,60s 刷新,点击展开)</text>

  <!-- settings button -->
  <rect x="36" y="378" width="206" height="36" rx="8" fill="#eef1f4"/>
  <circle cx="56" cy="396" r="5" fill="#9aa4af"/>
  <text x="70" y="400" font-size="13" fill="#24292f">设置 Settings</text>

  <!-- conversation area -->
  <rect x="274" y="20" width="562" height="430" rx="12" fill="#ffffff" stroke="#d9dee5"/>
  <text x="294" y="52" font-size="13" fill="#57606a">对话区(卡片锚定在条的右方 14px,不遮挡侧边栏)</text>

  <!-- detail card anchored to the right of the strip -->
  <rect x="282" y="110" width="300" height="330" rx="12" fill="#ffffff" stroke="#c9d1d9" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.12))"/>

  <!-- card header -->
  <rect x="282" y="110" width="300" height="36" rx="12" fill="#f6f8fa"/>
  <circle cx="298" cy="128" r="4" fill="#22c55e"/>
  <text x="310" y="132" font-size="10" font-weight="600" fill="#24292f">deepseek-v4-flash ▾</text>
  <text x="554" y="132" font-size="13" fill="#57606a">×</text>

  <!-- filter pills -->
  <rect x="294" y="156" width="136" height="24" rx="12" fill="#eef0f3"/>
  <text x="302" y="171" font-size="9" fill="#6b7280">时间维度</text>
  <text x="358" y="171" font-size="9" fill="#111827">近30天 ▾</text>
  <rect x="434" y="156" width="136" height="24" rx="12" fill="#eef0f3"/>
  <text x="442" y="171" font-size="9" fill="#6b7280">API Key</text>
  <text x="486" y="171" font-size="9" fill="#111827">sk-4c5… ▾</text>

  <!-- balance 2-col -->
  <line x1="282" y1="186" x2="582" y2="186" stroke="#e5e7eb"/>
  <text x="294" y="204" font-size="9" fill="#6b7280">充值余额</text>
  <text x="294" y="222" font-size="13" font-weight="700" fill="#3b82f6">¥0.74</text>
  <line x1="432" y1="192" x2="432" y2="228" stroke="#e5e7eb"/>
  <text x="444" y="204" font-size="9" fill="#6b7280">累计消费</text>
  <text x="444" y="222" font-size="13" font-weight="700" fill="#3b82f6">¥20.30</text>

  <!-- metrics 3-col -->
  <line x1="282" y1="240" x2="582" y2="240" stroke="#e5e7eb"/>
  <text x="294" y="258" font-size="9" fill="#6b7280">消费金额</text>
  <text x="294" y="274" font-size="11" font-weight="700" fill="#3b82f6">¥11.99</text>
  <line x1="382" y1="246" x2="382" y2="280" stroke="#e5e7eb"/>
  <text x="394" y="258" font-size="9" fill="#6b7280">API 请求</text>
  <text x="394" y="274" font-size="11" font-weight="700" fill="#3b82f6">1,118</text>
  <line x1="482" y1="246" x2="482" y2="280" stroke="#e5e7eb"/>
  <text x="494" y="258" font-size="9" fill="#6b7280">Tokens</text>
  <text x="494" y="274" font-size="9" font-weight="700" fill="#3b82f6">301,890,698</text>

  <!-- mini chart -->
  <line x1="282" y1="292" x2="582" y2="292" stroke="#e5e7eb"/>
  <rect x="308" y="356" width="22" height="10" rx="2" fill="rgba(59,130,246,0.3)"/>
  <rect x="338" y="346" width="22" height="20" rx="2" fill="rgba(59,130,246,0.45)"/>
  <rect x="368" y="332" width="22" height="34" rx="2" fill="rgba(59,130,246,0.6)"/>
  <rect x="398" y="316" width="22" height="50" rx="2" fill="rgba(59,130,246,0.8)"/>
  <rect x="428" y="326" width="22" height="40" rx="2" fill="rgba(59,130,246,0.7)"/>
  <rect x="458" y="336" width="22" height="30" rx="2" fill="rgba(59,130,246,0.55)"/>
  <rect x="488" y="352" width="22" height="14" rx="2" fill="rgba(59,130,246,0.35)"/>
  <text x="294" y="392" font-size="9" fill="#6b7280">近7天消费</text>

  <!-- token buttons -->
  <line x1="282" y1="406" x2="582" y2="406" stroke="#e5e7eb"/>
  <rect x="294" y="414" width="52" height="20" rx="6" fill="#eef0f3"/>
  <text x="302" y="428" font-size="9" fill="#111827">手动输入</text>
  <rect x="350" y="414" width="52" height="20" rx="6" fill="#eef0f3"/>
  <text x="358" y="428" font-size="9" fill="#111827">自动获取</text>
  <text x="416" y="428" font-size="8" fill="#6b7280">更新 14:23</text>
  <rect x="536" y="414" width="34" height="20" rx="6" fill="#eef0f3"/>
  <text x="545" y="428" font-size="9" fill="#111827">刷新</text>
</svg>
