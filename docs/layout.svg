<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="460" rx="16" fill="#f7f8fa"/>
  <!-- sidebar -->
  <rect x="24" y="20" width="230" height="420" rx="12" fill="#ffffff" stroke="#d9dee5"/>
  <text x="44" y="52" font-size="13" fill="#57606a">侧边栏 Sidebar</text>
  <rect x="44" y="70" width="150" height="28" rx="6" fill="#eef1f4"/>
  <text x="52" y="89" font-size="12" fill="#57606a">会话列表…</text>
  <line x1="44" y1="120" x2="234" y2="120" stroke="#eef1f4"/>
  <!-- usage strip (above settings) -->
  <rect x="36" y="322" width="206" height="34" rx="8" fill="#18191d" stroke="#3a3d44"/>
  <text x="44" y="337" font-size="10" font-weight="700" fill="#3b82f6">余额 0.74</text>
  <text x="104" y="337" font-size="10" fill="#9ca3af">消费 11.99</text>
  <text x="164" y="337" font-size="10" fill="#9ca3af">请求 1.1k</text>
  <text x="210" y="337" font-size="10" fill="#9ca3af">Tkn 302M</text>
  <text x="42" y="316" font-size="10" fill="#57606a">↑ 本插件(常显,60s 刷新,点击展开)</text>
  <!-- settings button -->
  <rect x="36" y="366" width="206" height="34" rx="8" fill="#eef1f4"/>
  <circle cx="56" cy="383" r="5" fill="#9aa4af"/>
  <text x="70" y="387" font-size="13" fill="#24292f">设置 Settings</text>
  <!-- conversation area -->
  <rect x="274" y="20" width="562" height="420" rx="12" fill="#ffffff" stroke="#d9dee5"/>
  <text x="294" y="52" font-size="13" fill="#57606a">对话区(卡片锚定在条的右方 14px)</text>
  <!-- detail card anchored to the right of the strip -->
  <rect x="300" y="96" width="300" height="300" rx="12" fill="#ffffff" stroke="#c9d1d9" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.12))"/>
  <rect x="300" y="96" width="300" height="34" rx="12" fill="#f6f8fa"/>
  <circle cx="316" cy="113" r="4" fill="#22c55e"/>
  <text x="328" y="117" font-size="10" font-weight="600" fill="#24292f">deepseek-v4-flash ▾</text>
  <text x="572" y="117" font-size="13" fill="#57606a">×</text>
  <!-- filter pills -->
  <rect x="312" y="140" width="136" height="22" rx="11" fill="#eef0f3"/>
  <text x="320" y="155" font-size="9" fill="#6b7280">时间维度</text><text x="374" y="155" font-size="9" fill="#111827">近30天 ▾</text>
  <rect x="452" y="140" width="136" height="22" rx="11" fill="#eef0f3"/>
  <text x="460" y="155" font-size="9" fill="#6b7280">API Key</text><text x="502" y="155" font-size="9" fill="#111827">sk-4c5… ▾</text>
  <!-- balance 2-col -->
  <rect x="300" y="172" width="150" height="52" fill="#ffffff"/>
  <text x="312" y="190" font-size="9" fill="#6b7280">充值余额</text><text x="312" y="207" font-size="13" font-weight="700" fill="#3b82f6">¥0.74</text>
  <line x1="450" y1="178" x2="450" y2="218" stroke="#e5e7eb"/>
  <text x="462" y="190" font-size="9" fill="#6b7280">累计消费</text><text x="462" y="207" font-size="13" font-weight="700" fill="#3b82f6">¥20.30</text>
  <!-- metrics 3-col -->
  <line x1="300" y1="224" x2="600" y2="224" stroke="#e5e7eb"/>
  <text x="312" y="242" font-size="9" fill="#6b7280">消费金额</text><text x="312" y="258" font-size="11" font-weight="700" fill="#3b82f6">¥11.99</text>
  <line x1="400" y1="230" x2="400" y2="264" stroke="#e5e7eb"/>
  <text x="412" y="242" font-size="9" fill="#6b7280">API 请求</text><text x="412" y="258" font-size="11" font-weight="700" fill="#3b82f6">1,118</text>
  <line x1="500" y1="230" x2="500" y2="264" stroke="#e5e7eb"/>
  <text x="512" y="242" font-size="9" fill="#6b7280">Tokens</text><text x="512" y="258" font-size="9" font-weight="700" fill="#3b82f6">301,890,698</text>
  <!-- mini chart -->
  <line x1="300" y1="268" x2="600" y2="268" stroke="#e5e7eb"/>
  <rect x="316" y="340" width="22" height="10" rx="2" fill="rgba(59,130,246,0.3)"/>
  <rect x="350" y="330" width="22" height="20" rx="2" fill="rgba(59,130,246,0.45)"/>
  <rect x="384" y="316" width="22" height="34" rx="2" fill="rgba(59,130,246,0.6)"/>
  <rect x="418" y="300" width="22" height="50" rx="2" fill="rgba(59,130,246,0.8)"/>
  <rect x="452" y="310" width="22" height="40" rx="2" fill="rgba(59,130,246,0.7)"/>
  <rect x="486" y="320" width="22" height="30" rx="2" fill="rgba(59,130,246,0.55)"/>
  <rect x="520" y="336" width="22" height="14" rx="2" fill="rgba(59,130,246,0.35)"/>
  <text x="316" y="372" font-size="9" fill="#6b7280">近7天消费</text>
  <!-- token buttons -->
  <line x1="300" y1="382" x2="600" y2="382" stroke="#e5e7eb"/>
  <rect x="312" y="390" width="52" height="20" rx="6" fill="#eef0f3"/>
  <text x="320" y="404" font-size="9" fill="#111827">手动输入</text>
  <rect x="368" y="390" width="52" height="20" rx="6" fill="#eef0f3"/>
  <text x="376" y="404" font-size="9" fill="#111827">自动获取</text>
  <text x="432" y="404" font-size="8" fill="#6b7280">更新 14:23</text>
  <rect x="548" y="390" width="40" height="20" rx="6" fill="#eef0f3"/>
  <text x="558" y="404" font-size="9" fill="#111827">刷新</text>
</svg>
